<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drishti - Human Pose Monitor</title>
    <link rel="icon" type="image/png" href="/assets/favion.png">
    <link rel="shortcut icon" type="image/png" href="/assets/favion.png">
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111b2b;
        --accent: #22c55e;
        --text: #edf6ff;
        --muted: #9bb3c9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #09111b 0%, #0b1220 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        color: #facc15;
      }

      .panel {
        background: rgba(17, 27, 43, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.28);
        overflow: hidden;
      }

      .video-box {
        display: flex;
        justify-content: center;
        background: #070d17;
        padding: 16px;
      }

      img {
        width: 100%;
        max-width: 960px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        background: #000;
      }

      .status {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 18px 20px 22px;
        font-size: 1rem;
      }

      .badge {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.35);
        color: #baf5d0;
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AI Human Pose &amp; Motion Detection</h1>

      <div class="panel">
        <div class="video-box">
          <img src="/video_feed" alt="Live camera feed" />
        </div>

        <div class="status">
          <div class="badge" id="human-count">Humans detected: --</div>
          <div class="badge" id="timestamp">Last update: --</div>
        </div>
      </div>
    </div>

    <script>
      async function refreshStatus() {
        try {
          const res = await fetch('/api/status');
          if (!res.ok) return;
          const data = await res.json();
          const count = document.getElementById('human-count');
          const stamp = document.getElementById('timestamp');

          count.textContent = 'Humans detected: ' + (data.humans_detected ?? 0);
          stamp.textContent = 'Last update: ' + (data.timestamp ?? 'N/A');
        } catch (err) {
          console.error('Status fetch failed', err);
        }
      }

      refreshStatus();
      setInterval(refreshStatus, 1000);
    </script>
  </body>
</html>
